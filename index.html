<!-- =====================================================
     UPLOAD STUDENT EXCEL
===================================================== -->

<div class="upload-section">

    <h2>📂 Upload Student Excel</h2>

    <p>
        Select an Excel file from your PC.
        Data will be added to the selected year.
    </p>

    <div class="upload-box">

        <input
            type="file"
            id="fileInput"
            accept=".xlsx,.xls"
        >

        <button
            type="button"
            onclick="uploadFile()"
            class="upload-btn"
        >
            ⬆ Upload Excel
        </button>

    </div>

    <p id="uploadMessage"></p>

</div>


<script>

async function uploadFile() {

    const fileInput =
        document.getElementById("fileInput");

    const message =
        document.getElementById("uploadMessage");

    if (!fileInput.files.length) {

        message.innerText =
            "Please select an Excel file.";

        return;
    }

    const file =
        fileInput.files[0];

    const formData =
        new FormData();

    formData.append(
        "file",
        file
    );

    // Current selected year
    const year =
        typeof selectedYear !== "undefined"
        ? selectedYear
        : "3rd Year";

    formData.append(
        "year",
        year
    );

    try {

        message.innerText =
            "Uploading...";

        const response =
            await fetch(
                "/api/upload",
                {
                    method: "POST",
                    body: formData
                }
            );

        const result =
            await response.json();

        if (result.success) {

            message.innerText =
                "✅ " + result.message;

            fileInput.value = "";

            // Reload dashboard data
            if (typeof loadStudents === "function") {
                loadStudents();
            }

            if (typeof loadStats === "function") {
                loadStats();
            }

        } else {

            message.innerText =
                "❌ " + result.message;
        }

    } catch (error) {

        console.error(error);

        message.innerText =
            "❌ Upload failed.";
    }
}

</script>
